name = "goatmire_gleam"
version = "1.0.0"
target = "javascript"

[dependencies]
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
lustre = ">= 5.7.1 and < 6.0.0"
rsvp = ">= 2.0.0 and < 3.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"

[dev_dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
lustre_dev_tools = ">= 2.4.0 and < 3.0.0"

[tools.lustre.bin]
bun = "system"

[tools.lustre.build]
outdir = "../../priv/static/assets/gleam"
minify = false

[tools.lustre.html]
stylesheets = ["/assets/css/app.css"]
